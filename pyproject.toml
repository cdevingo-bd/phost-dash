[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phost-dash"
version = "0.1.0.dev0"
description = "A local dashboard for phost: edit a graph, run it on your own GPU, watch it, and rank the results"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["phost", "phost-lab", "phost-score"]

[project.optional-dependencies]
author = ["phost-author"]
test = ["pytest>=7", "websocket-client"]

[project.scripts]
phost-dash = "phost_dash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phost_dash = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
